name: LunchNotice

on:
  schedule:
    - cron: "08 5 * * *"    # TSİ 08:08 (UTC 05:08)
    - cron: "08 7 * * *"    # TSİ 10:08 (UTC 07:08)
    - cron: "08 8 * * *"    # TSİ 11:08 (UTC 08:08)
    - cron: "08 9 * * *"    # TSİ 12:08 (UTC 09:08)
    - cron: "30 9 * * *"    # TSİ 12:30 (UTC 09:30)
  workflow_dispatch:

jobs:
  send_menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LunchNotice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCEL_PATH: "Nisan_2026_Tam_Menu.xlsx"
          SHEET_NAME: "Nisan 2026 Menü"
          SEND_TOMORROW: "false"
        run: python menu_to_telegram.py
