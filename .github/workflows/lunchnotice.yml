name: LunchNotice

on:
  schedule:
    - cron: "08 4 * * *"    # 04:08 Türkiye (UTC 04:05)
    - cron: "08 10 * * *"    # 04:08 Türkiye (UTC 04:05)
    - cron: "08 11 * * *"    # 04:08 Türkiye (UTC 04:05)
    - cron: "08 12 * * *"    # 04:08 Türkiye (UTC 04:05)
    - cron: "30 12 * * *"    # 04:08 Türkiye (UTC 04:05)
    workflow_dispatch:

jobs:
  send_menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LunchNotice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCEL_PATH: "Nisan_2026_Tam_Menu.xlsx"
          SHEET_NAME: "Nisan 2026 Menü"
          SEND_TOMORROW: "false"
        run: python menu_to_telegram.py
