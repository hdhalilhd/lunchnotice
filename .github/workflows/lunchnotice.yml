name: LunchNotice

on:
  schedule:
    - cron: "10 9 * * *"    # 12:10 Türkiye (UTC 09:10)
    - cron: "00 15 * * *"   # 18:00 Türkiye (UTC 15:00)
    - cron: "05 17 * * *"   # 20:05 Türkiye (UTC 17:05)
    - cron: "00 2 * * *"    # 05:00 Türkiye (UTC 02:00)
    - cron: "05 4 * * *"    # 07:05 Türkiye (UTC 04:05)
  workflow_dispatch:

jobs:
  send_menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LunchNotice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCEL_PATH: "Subat_2026_Yemek_Listesi.xlsx"
          SHEET_NAME: "Şubat 2026 Menü"
          SEND_TOMORROW: "false"
        run: python menu_to_telegram.py
